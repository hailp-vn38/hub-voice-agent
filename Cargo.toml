[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
slint = { version = "1", default-features = false }
slint-build = "1"
tokio = { version = "1", default-features = false }
jiff = "0.2"
anyhow = "1"
futures-util = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"

# Thư viện (Slint, femtovg, giải mã ảnh) chạy chậm ~10 lần khi chưa tối ưu: chuyển màn khựng ~0,5 s.
[profile.dev.package."*"]
opt-level = 3
