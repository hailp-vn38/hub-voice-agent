[package]
name = "hub"
edition.workspace = true
version.workspace = true

[[bin]]
name = "ai-hub"
path = "src/main.rs"

[dependencies]
hub-core = { path = "../../crates/hub-core" }
slint = { workspace = true, features = ["std", "compat-1-2"] }

[build-dependencies]
slint-build = { workspace = true }

[features]
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/renderer-femtovg"]
