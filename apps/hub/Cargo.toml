[package]
name = "hub"
edition.workspace = true
version.workspace = true

[[bin]]
name = "ai-hub"
path = "src/main.rs"

[dependencies]
hub-core = { path = "../../crates/hub-core" }
voice-client = { path = "../../crates/voice-client" }
slint = { workspace = true, features = ["std", "compat-1-2"] }
cpal = "0.18"
opus = "0.4"
rubato = "5.1"
rtrb = "0.4"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }

tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
anyhow = { workspace = true }
serde = { workspace = true }
toml = "1"
url = { workspace = true }
uuid = { version = "1", features = ["v4"] }
qrcode = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "time"] }

[build-dependencies]
slint-build = { workspace = true }

[features]
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/renderer-femtovg"]
pi = ["slint/backend-linuxkms", "slint/renderer-femtovg"]
demo = ["desktop", "dep:qrcode"]
